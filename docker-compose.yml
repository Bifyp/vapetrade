version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vapetrade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vapetrade
      POSTGRES_PASSWORD: vapetrade_secret
      POSTGRES_DB: vapetrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapetrade"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
